[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copypasta"
version = "0.1.0"
description = "CLI del recetario CopyPasta-Kitchen: list, show, get y check de recetas"
requires-python = ">=3.11,<3.15"  # pyyaml has no wheels for 3.15 yet; uv picks an older interpreter by itself
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.scripts]
copypasta = "copypasta.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/copypasta"]

# The installed package carries the catalog and the recipes, so `uvx --from git+... copypasta get` works anywhere.
[tool.hatch.build.targets.wheel.force-include]
"catalog.yaml" = "copypasta/catalog.yaml"
"recipes" = "copypasta/recipes"

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
pythonpath = ["cli"]
