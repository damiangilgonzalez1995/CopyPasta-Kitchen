# Índice de recetas. Lo que devuelve `copypasta list`.
# Cada entrada:
#   - id: fastapi-base                 # único, kebab-case
#     category: backend                # backend | agents | frontend | infra | ...
#     description: API REST base con FastAPI, config por entorno y tests   # una línea
#     tags: [api, python, fastapi]
#     path: recipes/backend/fastapi-base
#     requires: [otra-receta]          # opcional: hay que copiarla también para que funcione
#     uses: [otra-receta]              # opcional: referencia; se integra con ella pero no la trae

recipes:
  - id: project-settings
    category: backend
    description: Settings único del backend con pydantic-settings (.env), get_settings() en caché y composición por bloques
    tags: [settings, config, env, pydantic, python]
    path: recipes/backend/project-settings

  - id: langchain-agent
    category: agents
    description: Agente LLM con create_agent (LangChain v1), clase base, factory multi-proveedor, tools, prompts YAML y tests sin API keys
    tags: [agent, langchain, llm, tools, prompts, python]
    path: recipes/agents/langchain-agent
    uses: [project-settings]

  - id: langgraph-graph
    category: agents
    description: Grafo LangGraph de flujo fijo (router → agente | rechazo) con memoria propia, invoke JSON y streaming SSE
    tags: [graph, langgraph, agent, streaming, memory, python]
    path: recipes/agents/langgraph-graph
    requires: [langchain-agent, agent-memory]

  - id: agent-memory
    category: agents
    description: Memoria de conversación para agentes con backend elegido en settings (RAM o SQL), ventana por turnos e idempotencia
    tags: [memory, agent, history, sql, python]
    path: recipes/agents/agent-memory
    uses: [project-settings]

  - id: auth-verifier
    category: backend
    description: Verificación del token Bearer con proveedor elegido en settings (Supabase por JWKS, JWT propio o doble de test) que devuelve el usuario y su tenant
    tags: [auth, jwt, supabase, fastapi, security, python]
    path: recipes/backend/auth-verifier
    uses: [project-settings]

  - id: agent-chat-api
    category: backend
    description: Endpoints FastAPI de chat con el agente (POST /agent/chat en JSON y /agent/stream en SSE) con auth Bearer, guards y create_app
    tags: [api, fastapi, chat, sse, streaming, agent, python]
    path: recipes/backend/agent-chat-api
    requires: [langgraph-graph]
    uses: [project-settings, auth-verifier, rate-limit-quota]

  - id: vite-react-base
    category: frontend
    description: SPA Vite + React + TypeScript para un backend Python, con API intercambiable (http o fake) por configuración y tests
    tags: [frontend, react, vite, typescript, api-client]
    path: recipes/frontend/vite-react-base

  - id: react-agent-chat
    category: frontend
    description: Chat React con un agente en streaming SSE (tokens, tools, cancelar, errores, Markdown) para el contrato de langgraph-graph
    tags: [frontend, react, chat, sse, streaming, agent]
    path: recipes/frontend/react-agent-chat
    requires: [vite-react-base]
    uses: [agent-chat-api]

  - id: rate-limit-quota
    category: backend
    description: Rate limit por usuario y cuota diaria/mensual por tenant con la lógica en clases base, almacenamiento intercambiable (RAM o SQL) y 429 con código
    tags: [rate-limit, quota, api, fastapi, sql, python]
    path: recipes/backend/rate-limit-quota
    uses: [project-settings, agent-chat-api]

  - id: conversation-history
    category: backend
    description: Endpoints FastAPI del historial del chat (listar conversaciones con título y paginación, leer mensajes y borrar) sobre la memoria del agente
    tags: [api, fastapi, chat, history, conversations, python]
    path: recipes/backend/conversation-history
    requires: [agent-chat-api]

  - id: agent-feedback
    category: backend
    description: Pulgares arriba/abajo sobre respuestas del agente (un voto por usuario y mensaje, comentario, deshacer, lista por conversación) con backend RAM o SQL por settings
    tags: [api, fastapi, feedback, chat, agent, sql, python]
    path: recipes/backend/agent-feedback
    requires: [agent-chat-api]
    uses: [project-settings]
