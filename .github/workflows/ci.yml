name: ci

# The recipe book must stay coherent (catalog.yaml against recipes/) and the published package must
# serve what the repo tracks. Both are checked on every push and pull request.

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run check
      - run: npm test
